name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o /dev/null ./cmd/replog

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.6.2

  openapi:
    name: OpenAPI spec is up to date
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.6

      - name: Regenerate spec
        run: |
          swag init \
            --generalInfo swag.go \
            --dir ./internal/api \
            --output ./internal/api/openapi \
            --outputTypes yaml \
            --parseInternal \
            --parseDependency

      - name: Verify spec is committed
        run: |
          if ! git diff --exit-code -- internal/api/openapi/swagger.yaml; then
            echo ""
            echo "::error::OpenAPI spec is stale. Run 'just openapi' locally and commit the result."
            exit 1
          fi
