name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - name: Lint frontend (ESLint)
        run: cd web && npm run lint

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o /dev/null ./cmd/replog

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.6.2

  openapi:
    name: OpenAPI spec is up to date
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install swag
        # renovate: datasource=go depName=github.com/swaggo/swag
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.6

      - name: Regenerate spec
        run: |
          swag init \
            --generalInfo swag.go \
            --dir ./internal/api \
            --output ./internal/api/openapi \
            --outputTypes yaml \
            --parseInternal \
            --parseDependency

      - name: Verify spec is committed
        run: |
          if ! git diff --exit-code -- internal/api/openapi/swagger.yaml; then
            echo ""
            echo "::error::OpenAPI spec is stale. Run 'just openapi' locally and commit the result."
            exit 1
          fi

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # govulncheck flags only the CVEs whose vulnerable symbols are
      # actually reachable from our code. Keeps signal high; toolchain
      # bumps in go.mod will be enforced here too.
      - name: govulncheck (Go)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # npm audit covers the frontend dev/build dependencies. The
      # production-deps pass uses moderate+ as the bar; the all-deps
      # pass is high+ so dev-only CVEs (e.g. Vite path-traversal that
      # affects a developer running `just dev`) still fail the build
      # but a moderate dev-only finding doesn't block CI.
      - name: npm audit (production deps, moderate+)
        working-directory: web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=moderate

      - name: npm audit (all deps, high+)
        working-directory: web
        run: npm audit --audit-level=high

  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # actionlint catches typos, missing-key errors, shell quoting
      # bugs in `run:` blocks, and similar workflow-level mistakes
      # before they reach `main`. Tiny + fast (no Go/Node setup).
      # Defaults: fail-on-error=true, matcher=true, shellcheck=true.
      - name: Run actionlint
        uses: raven-actions/actionlint@v2
