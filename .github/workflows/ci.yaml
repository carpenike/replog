name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - name: Lint frontend (ESLint)
        run: cd web && npm run lint

      - name: Test frontend
        run: cd web && npm test

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o /dev/null ./cmd/replog

      - name: Vet
        run: go vet ./...

      - name: Test
        # -timeout raises the per-PACKAGE limit from go test's 10m default.
        # Under -race + coverage on a shared runner the internal/api package
        # alone runs ~10m (41s locally); main was passing a hair under the
        # default until PR #44 added tests and tipped it over. 20m is
        # headroom, not a target — a genuinely hung test still fails the run.
        # By PR #62/#63 internal/api ran ~16m under -race + coverage and main
        # (2e2fc2b) timed out at 20m with no test hung; 40m is the new headroom.
        run: go test -count=1 -race -timeout 40m -coverprofile=coverage.out ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: golangci-lint
        # v9.3.0 — pinned by commit because this step's linter version changed.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          # v2.13+ is required to typecheck a go 1.27 module (v2.6 cannot).
          version: v2.15.0

  openapi:
    name: OpenAPI spec is up to date
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install swag
        # renovate: datasource=go depName=github.com/swaggo/swag
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.6

      - name: Regenerate spec
        run: |
          swag init \
            --generalInfo swag.go \
            --dir ./internal/api \
            --output ./internal/api/openapi \
            --outputTypes yaml \
            --parseInternal \
            --parseDependency \
            --parseGoList=false

      - name: Verify spec is committed
        run: |
          if ! git diff --exit-code -- internal/api/openapi/swagger.yaml; then
            echo ""
            echo "::error::OpenAPI spec is stale. Run 'just openapi' locally and commit the result."
            exit 1
          fi

  frontend:
    name: web/dist is up to date
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Rebuild frontend bundle
        run: cd web && npm ci && npm run build

      - name: Verify web/dist is committed
        run: |
          if ! git diff --exit-code -- web/dist; then
            echo ""
            echo "::error::web/dist is stale. web/dist is embedded into the release binary, so a stale bundle ships an outdated SPA. Run 'just build' (or 'cd web && npm run build') locally and commit web/dist."
            exit 1
          fi

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # govulncheck flags only the CVEs whose vulnerable symbols are
      # actually reachable from our code. Keeps signal high; toolchain
      # bumps in go.mod will be enforced here too.
      - name: govulncheck (Go)
        env:
          # setup-go installed the go.mod toolchain (1.27.4). Stay on it.
          # golang.org/x/vuln@v1.10.0 declares go 1.26, and an older `go`
          # binary would download Go 1.26 to compile govulncheck.
          GOTOOLCHAIN: local
        run: |
          # renovate: datasource=go depName=golang.org/x/vuln
          # v1.1.4 is built with Go 1.22 and cannot load this module.
          # v1.10.0 (latest as of 2026-11-17) still cannot typecheck the
          # Go 1.27 stdlib in source mode (`govulncheck ./...`). Scan the
          # built binary instead; that mode reports reachable symbols.
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          go build -o /tmp/replog ./cmd/replog
          govulncheck -mode binary /tmp/replog

      # Production dependencies only. Dev-only advisories (the Vite
      # dev server, eslint, and similar) do not fail this job.
      - name: npm audit (production deps, moderate+)
        working-directory: web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=moderate

  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # actionlint catches typos, missing-key errors, shell quoting
      # bugs in `run:` blocks, and similar workflow-level mistakes
      # before they reach `main`. Tiny + fast (no Go/Node setup).
      # Defaults: fail-on-error=true, matcher=true, shellcheck=true.
      - name: Run actionlint
        uses: raven-actions/actionlint@v2
