# Builds ghcr.io/carpenike/replog, smoke-tests it, and pushes from main
# only. Pull requests build and test but push nothing.
#
# carpenike/replog is public, so this runs on ubuntu-latest. GitHub-hosted
# minutes are free for a public repo. The replog-k8s ARC scale set was for
# a private repo's Actions spending limit, which does not apply here, and
# a public repo must not get a privileged homelab Docker runner.
#
# A fork pull request runs this file. The build job has contents: read
# only. packages: write is on the push job, and that job runs only for a
# push to carpenike/replog main — never for a pull_request, and never for
# a fork.
#
# Action pins match carpenike/mcp .github/workflows/image.yml.
name: image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for test
        run: |
          docker buildx build --load --platform linux/amd64 \
            --build-arg COMMIT="$GITHUB_SHA" \
            -t replog:ci .

      - name: Smoke test (read-only root, writable /data, healthz)
        run: bash scripts/image-smoke.sh runtime replog:ci

      - name: No secret in the image filesystem or history
        run: bash scripts/image-smoke.sh secrets replog:ci

  push:
    name: push
    needs: image
    # Fork pull requests never reach this job. A fork's own push to its
    # main has a different github.repository, so it does not either.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'carpenike/replog'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/carpenike/replog
          # type=sha,format=long → sha-<full sha>
          # type=raw,value=main → main
          tags: |
            type=sha,format=long
            type=raw,value=main
          labels: |
            org.opencontainers.image.title=replog
            org.opencontainers.image.description=RepLog workout logbook

      - name: Push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          if [ "${#args[@]}" -eq 0 ]; then
            echo "no image tags to push" >&2
            exit 1
          fi
          docker buildx build --push --provenance=false --platform linux/amd64 \
            --build-arg COMMIT="$GITHUB_SHA" \
            "${args[@]}" .
