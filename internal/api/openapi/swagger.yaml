      description: Admin only. The plaintext is returned once and stored only as a
        SHA-256 hash, bound to this user. A service token cannot call this. REPLOG_SERVICE_TOKEN
        remains the env-installed coach-service row.
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      - description: Optional label
        in: body
        name: body
        schema:
          $ref: '#/definitions/api.ServiceTokenIssueRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.ServiceTokenIssued'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Issue a service token
      tags:
      - Admin
  /users/{userID}/service-tokens/{tokenID}:
    delete:
      description: Admin only. The token must belong to the user in the path. A service
        token cannot call this. Revoking the env-installed token does not clear REPLOG_SERVICE_TOKEN;
        the next startup installs it again.
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      - description: Token ID
        in: path
        name: tokenID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Revoke a service token
      tags:
      - Admin
  /users/{userID}/tokens:
    get:
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.LoginToken'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: List login tokens for user
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Returns the bare token in the response — it is shown to the admin
        once and never again.
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      - description: Optional label
        in: body
        name: body
        schema:
          $ref: '#/definitions/api.LoginTokenRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.LoginToken'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Create login token
      tags:
      - Admin
  /users/{userID}/tokens/{tokenID}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      - description: Token ID
        in: path
        name: tokenID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.StatusResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Revoke login token
      tags:
      - Admin
  /whiteboard:
    get:
      description: 'Read-only view of today''s session for one or more athletes: each
        athlete''s prescribed lines (from their active program) and the sets logged
        so far today. With no athletes parameter the board shows the caller''s own
        athlete, or for a coach every athlete they can see (up to 8). Each named athlete
        must be visible to the caller. Nothing is written.'
      parameters:
      - description: Comma-separated athlete IDs (at most 8)
        in: query
        name: athletes
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.WhiteboardResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Whiteboard (TV mode)
      tags:
      - Athletes
