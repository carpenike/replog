  /athletes/{id}/generate:
    get:
      description: 'Returns the inputs the SPA needs to render the generation form:
        athlete context, default days/weeks from active program, list of reference
        programs, and the latest generation (if any) so the SPA can resume a still-running
        draft after page reload. `configured=false` if no LLM provider is set up.'
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.GenerateFormResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: AI Coach form data
      tags:
      - Athletes
    post:
      consumes:
      - application/json
      description: Validates the request, inserts a generation row in 'pending' state,
        and spawns a background goroutine that calls the configured LLM provider with
        a context detached from the HTTP request. Returns 202 with the generation_id;
        the SPA polls GET /generations/{id} until the status is terminal, then commits
        via POST /generations/{id}/execute.
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: Generation request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.GenerateSubmitRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/api.GenerateSubmitResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
        "409":
          description: A draft is already in flight for this athlete
          schema:
            $ref: '#/definitions/api.APIError'
        "500":
          description: AI Coach not configured
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Enqueue an AI Coach generation
      tags:
      - Athletes
  /athletes/{id}/generations/{genID}:
    get:
      description: Returns the current status, plus reasoning/preview metrics when
        succeeded or the error message when failed. The SPA polls this endpoint while
        the generation is pending or running.
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: Generation ID
