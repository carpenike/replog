basePath: /api
definitions:
  api.APIError:
    properties:
      code:
        type: integer
      details:
        additionalProperties:
          type: string
        type: object
      error:
        type: string
    type: object
  api.Athlete:
    properties:
      avatar_url:
        type: string
      coach_id:
        type: integer
      created_at:
        type: string
      date_of_birth:
        type: string
      gender:
        type: string
      goal:
        type: string
      grade:
        type: string
      id:
        type: integer
      linked_user_id:
        type: integer
      name:
        type: string
      notes:
        type: string
      tier:
        type: string
      track_body_weight:
        type: boolean
      updated_at:
        type: string
    type: object
  api.AthleteCard:
    properties:
      active_assignments:
        type: integer
      avatar_url:
        type: string
      bw_trend:
        type: string
      id:
        type: integer
      last_workout_date:
        type: string
      name:
        type: string
      tier:
        type: string
      track_body_weight:
        type: boolean
      week_streak:
        type: integer
    type: object
  api.AthleteRequest:
    properties:
      date_of_birth:
        example: "2014-05-12"
        type: string
      gender:
        example: M
        type: string
      goal:
        type: string
      grade:
        example: 6th
        type: string
      name:
        example: Charlie
        type: string
      notes:
        type: string
      tier:
        example: foundational
        type: string
      track_body_weight:
        type: boolean
    type: object
  api.BodyWeight:
    properties:
      athlete_id:
        type: integer
      created_at:
        type: string
      date:
        type: string
      id:
        type: integer
      notes:
        type: string
      weight:
        type: number
    type: object
  api.BodyWeightPage:
    properties:
      entries:
        items:
          $ref: '#/definitions/api.BodyWeight'
        type: array
      has_more:
        type: boolean
    type: object
  api.BodyWeightRequest:
    properties:
      date:
        example: "2026-05-12"
        type: string
      notes:
        type: string
      weight:
        example: 185.5
        type: number
    type: object
  api.DashboardResponse:
    properties:
      athletes:
        items:
          $ref: '#/definitions/api.AthleteCard'
        type: array
      review_stats:
        $ref: '#/definitions/api.ReviewStats'
      stats:
        $ref: '#/definitions/api.DashboardStats'
    type: object
  api.DashboardStats:
    properties:
      consecutive_weeks:
        type: integer
      total_athletes:
        type: integer
      trained_this_week:
        type: integer
      week_sessions:
        type: integer
      week_volume:
        type: number
    type: object
  api.Exercise:
    properties:
      created_at:
        type: string
      demo_url:
        type: string
      featured:
        type: boolean
      form_notes:
        type: string
      id:
        type: integer
      name:
        type: string
      rest_seconds:
        type: integer
      tier:
        type: string
      updated_at:
        type: string
    type: object
  api.ExerciseHistoryDay:
    properties:
      sets:
        items:
          $ref: '#/definitions/api.ExerciseHistoryEntry'
        type: array
      workout_date:
        type: string
      workout_id:
        type: integer
    type: object
  api.ExerciseHistoryEntry:
    properties:
      notes:
        type: string
      reps:
        type: integer
      rpe:
        type: number
      set_number:
        type: integer
      weight:
        type: number
      workout_date:
        type: string
      workout_id:
        type: integer
    type: object
  api.ExerciseHistoryPage:
    properties:
      days:
        items:
          $ref: '#/definitions/api.ExerciseHistoryDay'
        type: array
      has_more:
        type: boolean
    type: object
  api.ExerciseRequest:
    properties:
      demo_url:
        type: string
      featured:
        type: boolean
      form_notes:
        type: string
      name:
        example: Bench Press
        type: string
      rest_seconds:
        example: 90
        type: integer
      tier:
        example: foundational
        type: string
    type: object
  api.LoginRequest:
    properties:
      password:
        example: hunter2
        type: string
      username:
        example: admin
        type: string
    type: object
  api.PreferencesRequest:
    properties:
      date_format:
        example: Jan 2, 2006
        type: string
      timezone:
        example: America/New_York
        type: string
      weight_unit:
        example: lbs
        type: string
    type: object
  api.ReviewStats:
    properties:
      approved_count:
        type: integer
      needs_work:
        type: integer
      pending_count:
        type: integer
    type: object
  api.StatusResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  api.TrainingMax:
    properties:
      athlete_id:
        type: integer
      created_at:
        type: string
      effective_date:
        type: string
      exercise_id:
        type: integer
      exercise_name:
        type: string
      id:
        type: integer
      notes:
        type: string
      weight:
        type: number
    type: object
  api.TrainingMaxRequest:
    properties:
      effective_date:
        example: "2026-05-12"
        type: string
      exercise_id:
        example: 42
        type: integer
      notes:
        type: string
      weight:
        example: 315
        type: number
    type: object
  api.User:
    properties:
      athlete_id:
        type: integer
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      impersonating:
        type: boolean
      is_admin:
        type: boolean
      is_coach:
        type: boolean
      name:
        type: string
      real_user_id:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  api.UserPreferences:
    properties:
      created_at:
        type: string
      date_format:
        type: string
      id:
        type: integer
      timezone:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
      weight_unit:
        type: string
    type: object
  api.Workout:
    properties:
      assignment_id:
        type: integer
      athlete_id:
        type: integer
      athlete_name:
        type: string
      created_at:
        type: string
      date:
        type: string
      id:
        type: integer
      notes:
        type: string
      program_name:
        type: string
      review_status:
        type: string
      set_count:
        type: integer
      updated_at:
        type: string
    type: object
  api.WorkoutNotesRequest:
    properties:
      notes:
        type: string
    type: object
  api.WorkoutPage:
    properties:
      has_more:
        type: boolean
      workouts:
        items:
          $ref: '#/definitions/api.Workout'
        type: array
    type: object
  api.WorkoutRequest:
    properties:
      date:
        example: "2026-05-12"
        type: string
      notes:
        type: string
    type: object
  api.WorkoutSet:
    properties:
      category:
        type: string
      created_at:
        type: string
      exercise_id:
        type: integer
      exercise_name:
        type: string
      id:
        type: integer
      notes:
        type: string
      rep_type:
        type: string
      reps:
        type: integer
      reps_label:
        type: string
      rpe:
        type: number
      set_number:
        type: integer
      updated_at:
        type: string
      weight:
        type: number
      workout_id:
        type: integer
    type: object
  api.WorkoutSetRequest:
    properties:
      category:
        example: main
        type: string
      exercise_id:
        example: 42
        type: integer
      notes:
        type: string
      rep_type:
        example: reps
        type: string
      reps:
        example: 5
        type: integer
      rpe:
        example: 7
        type: number
      weight:
        example: 135
        type: number
    type: object
  api.WorkoutSetUpdateRequest:
    properties:
      notes:
        type: string
      reps:
        example: 5
        type: integer
      rpe:
        example: 7
        type: number
      weight:
        example: 135
        type: number
    type: object
info:
  contact: {}
  description: |-
    REST API for the RepLog workout tracking application.

    Authentication uses session cookies issued by `POST /api/login`
    (or the WebAuthn / token-login endpoints). Cookies are
    `HttpOnly`, `SameSite=Lax`, and (in production) `Secure`.
    The browser sends them automatically on subsequent requests.
  title: RepLog API
  version: 1.0.0
paths:
  /athletes:
    get:
      description: |-
        Returns athlete cards visible to the caller (admins see all,
        coaches see only athletes they own).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.AthleteCard'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.APIError'
      summary: List athletes
      tags:
      - Athletes
    post:
      consumes:
      - application/json
      parameters:
      - description: Athlete
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.AthleteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.Athlete'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Create athlete
      tags:
      - Athletes
  /athletes/{id}:
    delete:
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Delete athlete
      tags:
      - Athletes
    get:
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Athlete'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Get athlete
      tags:
      - Athletes
    put:
      consumes:
      - application/json
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: Athlete
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.AthleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Athlete'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Update athlete
      tags:
      - Athletes
  /athletes/{id}/body-weights:
    get:
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BodyWeightPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: List body weights
      tags:
      - Athletes
    post:
      consumes:
      - application/json
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: Entry
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.BodyWeightRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.BodyWeight'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Log body weight
      tags:
      - Athletes
  /athletes/{id}/body-weights/{bwID}:
    delete:
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: Body weight entry ID
        in: path
        name: bwID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Delete body weight
      tags:
      - Athletes
  /athletes/{id}/exercises/{exerciseID}/history:
    get:
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: Exercise ID
        in: path
        name: exerciseID
        required: true
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ExerciseHistoryPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Exercise history for athlete
      tags:
      - Exercises
  /athletes/{id}/exercises/{exerciseID}/training-maxes:
    get:
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: Exercise ID
        in: path
        name: exerciseID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.TrainingMax'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Get training max history
      tags:
      - TrainingMaxes
  /athletes/{id}/training-maxes:
    get:
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.TrainingMax'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: List current training maxes
      tags:
      - TrainingMaxes
    post:
      consumes:
      - application/json
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: TM
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.TrainingMaxRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.TrainingMax'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Set training max
      tags:
      - TrainingMaxes
  /athletes/{id}/workouts:
    get:
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.WorkoutPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: List workouts
      tags:
      - Workouts
    post:
      consumes:
      - application/json
      description: One workout per athlete per day (UNIQUE constraint). Date defaults
        to today if omitted.
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: Workout
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.WorkoutRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.Workout'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Create workout
      tags:
      - Workouts
  /athletes/{id}/workouts/{workoutID}:
    delete:
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: Workout ID
        in: path
        name: workoutID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Delete workout
      tags:
      - Workouts
    get:
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: Workout ID
        in: path
        name: workoutID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: workout + sets grouped by exercise
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Get workout
      tags:
      - Workouts
  /athletes/{id}/workouts/{workoutID}/notes:
    put:
      consumes:
      - application/json
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: Workout ID
        in: path
        name: workoutID
        required: true
        type: integer
      - description: Notes
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.WorkoutNotesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Update workout notes
      tags:
      - Workouts
  /athletes/{id}/workouts/{workoutID}/sets:
    post:
      consumes:
      - application/json
      description: rep_type defaults to 'reps' and category to 'main' when omitted;
        both are CHECK-constrained in the schema.
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: Workout ID
        in: path
        name: workoutID
        required: true
        type: integer
      - description: Set
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.WorkoutSetRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.WorkoutSet'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Add set to workout
      tags:
      - Workouts
  /athletes/{id}/workouts/{workoutID}/sets/{setID}:
    delete:
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: Workout ID
        in: path
        name: workoutID
        required: true
        type: integer
      - description: Set ID
        in: path
        name: setID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Delete set
      tags:
      - Workouts
    put:
      consumes:
      - application/json
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: Workout ID
        in: path
        name: workoutID
        required: true
        type: integer
      - description: Set ID
        in: path
        name: setID
        required: true
        type: integer
      - description: Set
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.WorkoutSetUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.WorkoutSet'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Update set
      tags:
      - Workouts
  /dashboard:
    get:
      description: Returns athlete cards plus aggregated stats (only available to
        coaches/admins).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.DashboardResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Dashboard data
      tags:
      - Dashboard
