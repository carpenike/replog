          schema:
            $ref: '#/definitions/api.APIError'
      summary: Get AI Coach generation status
      tags:
      - Athletes
  /athletes/{id}/generations/{genID}/cancel:
    post:
      description: Idempotent cancel. If the generation has already reached a terminal
        state this is a no-op and the current row is returned.
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: Generation ID
        in: path
        name: genID
        required: true
        type: integer
      produces:
