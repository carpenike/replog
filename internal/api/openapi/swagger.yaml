  /login:
    post:
      consumes:
      - application/json
      description: |-
        Authenticates a user, renews the session token to prevent
        fixation, and sets a `HttpOnly`, `SameSite=Lax` session cookie.
        Subsequent requests in the same browser are authenticated
        automatically.

        After 5 consecutive wrong-password attempts the account is
        temporarily locked for 15 minutes (ADR 014). Locked
        responses are 429 with a `Retry-After` header in seconds.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.User'
        "400":
          description: missing or malformed credentials
          schema:
            $ref: '#/definitions/api.APIError'
        "401":
          description: invalid username or password
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: account uses passwordless login
          schema:
            $ref: '#/definitions/api.APIError'
        "429":
          description: account temporarily locked (Retry-After header set)
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Log in with username and password
      tags:
      - Auth
