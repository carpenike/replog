        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Delete a form-check video
      tags:
      - Workouts
    get:
      description: Returns the clip bytes with its sniffed Content-Type. Supports
        HTTP Range requests, so a video element can seek. Same access as the workout
        read; the file is never served from a public path.
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: Workout ID
        in: path
        name: workoutID
        required: true
        type: integer
      - description: Set ID
        in: path
        name: setID
        required: true
        type: integer
      produces:
      - video/mp4
      - video/quicktime
      - video/webm
      responses:
        "200":
          description: OK
          schema:
            type: file
        "206":
          description: Partial Content
          schema:
            type: file
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Stream a form-check video
      tags:
      - Workouts
    post:
      consumes:
      - multipart/form-data
      description: Multipart upload; field name is 'video'. The server sniffs the
        container and accepts only MP4, QuickTime (.mov, as an iPhone records) or
        WebM, up to the configured cap (REPLOG_VIDEO_MAX_MB, default 100 MiB). Uploading
        again replaces the set's clip and clears its coach comment. The clip is served
        back only through the authenticated set route. Browser session only.
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: Workout ID
        in: path
        name: workoutID
        required: true
        type: integer
      - description: Set ID
        in: path
        name: setID
        required: true
        type: integer
      - description: Video clip (MP4/MOV/WebM)
        in: formData
        name: video
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.SetVideo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIError'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.APIError'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.APIError'
        "503":
          description: video storage not configured
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Upload a form-check video
      tags:
      - Workouts
