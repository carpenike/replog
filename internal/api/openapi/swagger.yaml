info:
  contact: {}
  description: |-
    REST API for the RepLog workout tracking application.

    Authentication uses session cookies issued by `POST /api/login`
    (or the WebAuthn / token-login endpoints). Cookies are
    `HttpOnly`, `SameSite=Lax`, and (in production) `Secure`.
    The browser sends them automatically on subsequent requests.
  title: RepLog API
  version: 1.0.0
paths:
  /admin/impersonate/{userId}:
    post:
      description: 'Admins can impersonate any user; coaches can impersonate users
        linked to athletes they own. Sets `impersonating: true` on subsequent /me
        responses.'
      parameters:
      - description: Target user ID
        in: path
        name: userId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Start impersonation
      tags:
      - Admin
  /admin/impersonateable:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.User'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: List impersonateable users
      tags:
      - Admin
  /admin/settings:
    get:
      description: Sensitive settings (LLM keys, SMTP password) return empty `value`
        and only a masked preview — plaintext is never sent over the wire.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.SettingCategoryResponse'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: List app settings (admin)
      tags:
      - Admin
    put:
      consumes:
      - application/json
      description: Sensitive values (Sensitive=true in the registry) are encrypted
        with REPLOG_SECRET_KEY before storage.
      parameters:
      - description: Setting
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.SettingUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Update app setting (admin)
      tags:
      - Admin
  /admin/settings/test-notify:
    post:
      description: Always returns 200; check `success` field. Errors are surfaced
        via `error` field for the SPA to display inline.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Test notification provider connection (admin)
      tags:
      - Admin
  /admin/stop-impersonating:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Stop impersonation
      tags:
      - Admin
  /athletes:
    get:
      description: |-
        Returns athlete cards visible to the caller (admins see all,
        coaches see only athletes they own).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.AthleteCard'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.APIError'
      summary: List athletes
      tags:
      - Athletes
    post:
      consumes:
      - application/json
      parameters:
      - description: Athlete
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.AthleteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.Athlete'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Create athlete
      tags:
      - Athletes
  /athletes/{id}:
    delete:
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Delete athlete
      tags:
      - Athletes
    get:
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Athlete'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Get athlete
      tags:
      - Athletes
    put:
      consumes:
      - application/json
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: Athlete
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.AthleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Athlete'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Update athlete
      tags:
      - Athletes
  /athletes/{id}/accessories:
    get:
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.AccessoryPlan'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: List accessory plans
      tags:
      - Athletes
    post:
      consumes:
      - application/json
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: Plan
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.AccessoryPlanRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.AccessoryPlan'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Create accessory plan
      tags:
      - Athletes
  /athletes/{id}/accessories/{planID}:
    delete:
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: Plan ID
        in: path
        name: planID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Delete accessory plan
      tags:
      - Athletes
    put:
      consumes:
      - application/json
      parameters:
      - description: Athlete ID
        in: path
        name: id
        required: true
        type: integer
      - description: Plan ID
        in: path
        name: planID
        required: true
        type: integer
      - description: Plan
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.AccessoryPlanUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AccessoryPlan'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "403":
          description: Forbidden
