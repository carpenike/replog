        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIError'
      summary: Cancel an AI Coach generation
      tags:
      - Athletes
  /athletes/{id}/generations/{genID}/execute:
    post:
      description: Parses the stored CatalogJSON, runs ExecuteCatalogImport, and auto-assigns
